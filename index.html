<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1020" />
    <meta name="description" content="브라우저에서 바로 즐기는 블록 퍼즐 게임. 리더보드와 피드백을 지원합니다." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Stack Drop</title>
  </head>
  <body>
    <header class="topbar">
      <h1 class="logo">STACK<span>DROP</span></h1>
      <div class="topbar-actions">
        <button id="mute-btn" class="icon-btn" type="button" aria-label="음소거" aria-pressed="false" title="음소거 (M)">🔊</button>
        <button id="settings-btn" class="icon-btn" type="button" aria-label="설정 열기" title="설정">⚙</button>
      </div>
    </header>

    <main class="layout">
      <section class="game-area" aria-label="게임">
        <aside class="panel panel-left">
          <div class="box">
            <h2>HOLD</h2>
            <canvas id="hold-canvas" class="preview hold" aria-label="보관한 블록"></canvas>
          </div>
          <dl class="box stats">
            <div><dt>SCORE</dt><dd id="stat-score">0</dd></div>
            <div><dt>LEVEL</dt><dd id="stat-level">1</dd></div>
            <div><dt>LINES</dt><dd id="stat-lines">0</dd></div>
            <div><dt>BEST</dt><dd id="stat-best">0</dd></div>
          </dl>
        </aside>

        <div class="board-wrap">
          <canvas id="board-canvas" class="board" aria-label="게임 보드"></canvas>

          <div id="overlay" class="overlay">
            <div class="overlay-panel" data-panel="start">
              <p class="overlay-title">STACK DROP</p>
              <p class="muted">블록을 쌓아 가로줄을 채우세요.</p>
              <button id="start-btn" class="btn btn-primary" type="button">시작하기</button>
              <ul class="keys">
                <li><kbd>←</kbd><kbd>→</kbd> 이동</li>
                <li><kbd>↓</kbd> 천천히 내리기</li>
                <li><kbd>Space</kbd> 바로 내리기</li>
                <li><kbd>↑</kbd><kbd>X</kbd> / <kbd>Z</kbd> 회전</li>
                <li><kbd>C</kbd> 홀드</li>
                <li><kbd>P</kbd> 일시정지 · <kbd>M</kbd> 음소거</li>
              </ul>
            </div>

            <div class="overlay-panel" data-panel="pause" hidden>
              <p class="overlay-title">일시정지</p>
              <button id="resume-btn" class="btn btn-primary" type="button">계속하기</button>
              <button id="restart-btn" class="btn" type="button">처음부터</button>
            </div>

            <div class="overlay-panel" data-panel="over" hidden>
              <p class="overlay-title">GAME OVER</p>
              <p class="final-score" id="over-score">0</p>
              <p class="muted" id="over-detail"></p>
              <p class="new-best" id="over-best" hidden>새 개인 최고 기록!</p>
              <form id="score-form" class="score-form" novalidate>
                <label for="score-nickname">닉네임</label>
                <div class="score-form-row">
                  <input id="score-nickname" name="nickname" type="text" minlength="2" maxlength="12" autocomplete="nickname" placeholder="2~12자" required />
                  <button id="score-submit" class="btn btn-primary" type="submit">등록</button>
                </div>
                <p id="score-msg" class="form-msg" role="status"></p>
              </form>
              <button id="retry-btn" class="btn" type="button">다시 하기</button>
            </div>
          </div>
        </div>

        <aside class="panel panel-next">
          <div class="box">
            <h2>NEXT</h2>
            <canvas id="next-canvas" class="preview next" aria-label="다음 블록"></canvas>
          </div>
        </aside>

        <section class="box leaderboard" aria-labelledby="lb-title">
          <div class="box-head">
            <h2 id="lb-title">LEADERBOARD</h2>
            <button id="lb-refresh" class="link-btn" type="button" aria-label="리더보드 새로고침">새로고침</button>
          </div>
          <p id="lb-status" class="muted small"></p>
          <ol id="lb-list" class="lb-list"></ol>
        </section>

        <div id="touch-controls" class="touch-controls" aria-label="터치 조작">
          <button type="button" data-action="hold" aria-label="홀드">HOLD</button>
          <button type="button" data-action="rotateCCW" aria-label="반시계 회전">⟲</button>
          <button type="button" data-action="rotateCW" aria-label="시계 회전">⟳</button>
          <button type="button" data-action="pause" aria-label="일시정지">Ⅱ</button>
          <button type="button" data-action="left" aria-label="왼쪽">◀</button>
          <button type="button" data-action="softDrop" aria-label="아래로">▼</button>
          <button type="button" data-action="right" aria-label="오른쪽">▶</button>
          <button type="button" data-action="hardDrop" aria-label="바로 내리기">⤓</button>
        </div>
      </section>

      <section id="feedback" class="feedback" aria-labelledby="fb-title">
        <h2 id="fb-title">피드백</h2>
        <p class="muted small">게임에 대한 의견, 버그, 제안을 자유롭게 남겨 주세요.</p>
        <form id="fb-form" class="fb-form" novalidate>
          <div class="fb-fields">
            <label>닉네임
              <input name="nickname" type="text" minlength="2" maxlength="12" autocomplete="nickname" placeholder="2~12자" required />
            </label>
            <label>분류
              <select name="category">
                <option value="opinion">의견</option>
                <option value="bug">버그</option>
                <option value="suggestion">제안</option>
              </select>
            </label>
            <label>별점
              <select name="rating">
                <option value="">선택 안 함</option>
                <option value="5">★★★★★</option>
                <option value="4">★★★★☆</option>
                <option value="3">★★★☆☆</option>
                <option value="2">★★☆☆☆</option>
                <option value="1">★☆☆☆☆</option>
              </select>
            </label>
          </div>
          <label>내용
            <textarea name="content" rows="4" maxlength="500" placeholder="최대 500자" required></textarea>
          </label>
          <div class="fb-foot">
            <span id="fb-count" class="muted small">0 / 500</span>
            <span id="fb-msg" class="form-msg" role="status"></span>
            <button class="btn btn-primary" type="submit">등록</button>
          </div>
        </form>
        <p id="fb-list-status" class="muted small"></p>
        <ul id="fb-list" class="fb-list"></ul>
        <button id="fb-more" class="btn" type="button" hidden>더 보기</button>
      </section>
    </main>

    <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 id="settings-title">사운드 설정</h2>
        <label class="slider">
          <span>배경음</span>
          <input id="bgm-volume" type="range" min="0" max="100" step="5" />
          <output id="bgm-volume-out"></output>
        </label>
        <label class="slider">
          <span>효과음</span>
          <input id="sfx-volume" type="range" min="0" max="100" step="5" />
          <output id="sfx-volume-out"></output>
        </label>
        <label class="check">
          <input id="muted" type="checkbox" />
          <span>전체 음소거</span>
        </label>
        <div class="dialog-foot">
          <button class="btn btn-primary" value="close">닫기</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
